services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ghorob_chams_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=${APP_URL:-http://localhost:3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ghorob_user}:${POSTGRES_PASSWORD:-ghorob_secure_pass_2026}@db:5432/${POSTGRES_DB:-ghorob_chams_db}?sslmode=disable
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-ghorob_chams_production_secret_key_change_me}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/app/data

  db:
    image: postgres:16-alpine
    container_name: ghorob_chams_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ghorob_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghorob_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ghorob_chams_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ghorob_user} -d ${POSTGRES_DB:-ghorob_chams_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  app_data:
